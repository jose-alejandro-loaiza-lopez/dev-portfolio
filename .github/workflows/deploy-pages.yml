name: CI/CD - GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Build Angular app
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Configure SPA fallback
        run: cp dist/dev-portfolio/browser/index.html dist/dev-portfolio/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/dev-portfolio/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify deployment
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check published site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          echo "Verificando $PAGE_URL"

          for attempt in $(seq 1 12); do
            if curl -fsSL --compressed --max-time 30 "$PAGE_URL" | grep -q "José Alejandro Loaiza López"; then
              echo "✔ El portafolio está disponible y sirve el contenido esperado."
              exit 0
            fi

            echo "Intento $attempt/12: la página aún no responde con el contenido esperado."
            sleep 10
          done

          echo "✖ La verificación del despliegue falló."
          exit 1
