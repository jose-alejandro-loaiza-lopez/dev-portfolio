<section id="contacto" class="section contact">
  <div class="container">
    <div class="contact-panel">
      <div class="contact-copy">
        <p class="eyebrow">Contacto</p>
        <h2 class="section-title">¿Revisamos un proyecto juntos?</h2>
        <p>
          Estoy abierto a prácticas profesionales, proyectos académicos y colaboraciones donde
          pueda aportar en frontend, backend o automatización de despliegues.
        </p>
      </div>

      <div class="contact-actions">
        <a class="btn btn-primary" [href]="githubUrl" target="_blank" rel="noopener noreferrer">
          Hablar por GitHub
        </a>
        <a
          class="btn btn-ghost"
          [href]="portfolioRepoUrl"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ver código del portafolio
        </a>
      </div>
    </div>
  </div>
</section>
